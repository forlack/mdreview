[package]
name = "mdreview"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Local-first Markdown review viewer"
license = "MIT"
repository = "https://github.com/forlack/mdreview"
homepage = "https://github.com/forlack/mdreview"
readme = "README.md"
keywords = ["markdown", "review", "comments", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4.3"
mime_guess = "2.0.5"
rand = "0.9.2"
rust-embed = "8.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
ulid = { version = "1.2.1", features = ["serde"] }
webbrowser = "1.2.1"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
